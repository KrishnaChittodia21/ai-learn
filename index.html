<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f5ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05040d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GenAI.learn: learn generative AI from first principles to production, by practising every concept." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenAI.learn</title>
    <style>
      /* M9 cold-start splash: invisible for 300 ms (fast loads never see it); removed by main.tsx after first render */
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f7f5ff; color: #17123a; font: 700 1.6rem/1 system-ui, sans-serif; letter-spacing: -0.02em; }
      @media (prefers-color-scheme: dark) { #boot { background: #05040d; color: #f4f2ff; } }
      #boot .in { display: flex; align-items: center; gap: 12px; animation: boot-in 360ms cubic-bezier(0.22, 1, 0.36, 1) 300ms both; }
      #boot b { color: #ff4fa3; }
      #boot .tri { stroke-dasharray: 40; stroke-dashoffset: 40; animation: boot-tri 700ms cubic-bezier(0.22, 1, 0.36, 1) 450ms forwards; }
      #boot .n { opacity: 0.25; animation: boot-node 300ms ease forwards; }
      #boot .n1 { animation-delay: 450ms; } #boot .n2 { animation-delay: 650ms; } #boot .n3 { animation-delay: 850ms; }
      #boot .wm { animation: boot-wipe 520ms cubic-bezier(0.22, 1, 0.36, 1) 500ms both; }
      #boot .line { position: absolute; left: 50%; top: calc(50% + 48px); width: 160px; height: 2px; margin-left: -80px; border-radius: 2px; overflow: hidden; background: rgb(124 92 255 / 0.18); animation: boot-fade 200ms ease 900ms both; }
      #boot .line::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #22e4ff, #7c5cff); transform: translateX(-100%); animation: boot-sweep 1.1s linear 900ms infinite; }
      #boot.done { transition: opacity 200ms ease; opacity: 0; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.96); } }
      @keyframes boot-tri { to { stroke-dashoffset: 0; } }
      @keyframes boot-node { to { opacity: 1; } }
      @keyframes boot-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes boot-fade { from { opacity: 0; } }
      @keyframes boot-sweep { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .in { animation: boot-fade 150ms ease 300ms both; }
        #boot .tri { stroke-dashoffset: 0; animation: none; }
        #boot .n { opacity: 1; animation: none; }
        #boot .wm, #boot .line::after { animation: none; }
        #boot .line { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="in">
        <svg width="44" height="44" viewBox="0 0 30 30"><defs><linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#ff4fa3"/><stop offset="1" stop-color="#22e4ff"/></linearGradient></defs><circle cx="15" cy="15" r="13" fill="none" stroke="url(#boot-g)" stroke-width="2"/><path class="tri" d="M15 7 L8 19 L22 19 Z" fill="none" stroke="url(#boot-g)" stroke-width="1.4"/><circle class="n n1" cx="15" cy="7" r="2.6" fill="#22e4ff"/><circle class="n n2" cx="8" cy="19" r="2.6" fill="#7c5cff"/><circle class="n n3" cx="22" cy="19" r="2.6" fill="#ff4fa3"/></svg>
        <span class="wm">GenAI<b>.</b>learn</span>
      </div>
      <div class="line"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
