# Validate content, test, type-check, lint and build on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # tests and validators import .ts sources directly: needs type stripping on by default (Node >= 22.18)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx oxlint src
      - run: npm run validate
      - run: npm test
      - run: npm run build
      # fails if the entry or any route chunk grows > 30 KB gzip over scripts/bundle-budget.json
      - run: npm run check:bundle
